name: Update contributions graph

on:
  schedule:
    - cron: "17 0 * * *" # daily, 00:17 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: contributions-graph
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Render SVGs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
        run: python3 scripts/contributions_graph.py --user "$OWNER" --out assets/images

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/images/contributions-*.svg
          git diff --cached --quiet && echo "no change" && exit 0
          git commit -m "chore: refresh contributions graph"
          git push
